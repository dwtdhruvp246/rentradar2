<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Choose a new password | Mushavo</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"><link rel="stylesheet" href="/assets/css/styles.css"><script src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js" defer></script></head><body><main class="auth-page auth-page-single"><section class="auth-panel auth-panel-centered"><a class="brand" href="/index.html"><img class="auth-logo" src="/assets/img/mushavo-mark.png" alt=""><span>Mushavo</span></a><div class="auth-heading"><p class="eyebrow">Account recovery</p><h1>Choose a new password</h1><p>Use at least eight characters and avoid reusing a password from another service.</p></div><form class="form-stack" data-auth-form data-mode="reset"><div class="field"><label for="password">New password</label><div class="input-action"><input id="password" name="password" type="password" minlength="8" required autocomplete="new-password"><button type="button" aria-label="Show password" data-password-toggle="password"><i data-lucide="eye"></i></button></div></div><div class="field"><label for="confirm-password">Confirm password</label><div class="input-action"><input id="confirm-password" name="confirmPassword" type="password" minlength="8" required autocomplete="new-password"><button type="button" aria-label="Show password" data-password-toggle="confirm-password"><i data-lucide="eye"></i></button></div></div><p class="form-message" data-form-message role="status"></p><button class="btn btn-primary" type="submit">Update password</button></form></section></main><script type="module" src="/assets/js/auth-pages.js"></script></body></html>
